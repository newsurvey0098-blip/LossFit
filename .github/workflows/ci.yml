name: LossFit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lossfit
          POSTGRES_PASSWORD: lossfit-ci-only
          POSTGRES_DB: lossfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://lossfit:lossfit-ci-only@127.0.0.1:5432/lossfit
      JWT_SECRET: ci-only-signing-secret-not-for-deployment-0123456789
      DELETION_LEDGER_SECRET: ci-only-ledger-secret-not-for-deployment-0123456789
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lossfit
          POSTGRES_PASSWORD: lossfit-ci-only
          POSTGRES_DB: lossfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://lossfit:lossfit-ci-only@127.0.0.1:5432/lossfit
      JWT_SECRET: ci-only-signing-secret-not-for-deployment-0123456789
      DELETION_LEDGER_SECRET: ci-only-ledger-secret-not-for-deployment-0123456789
      ENVIRONMENT: development
      CORS_ORIGINS: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 3001 --no-access-log > /tmp/lossfit-api.log 2>&1 &
      - run: for i in {1..60}; do curl --fail --silent http://127.0.0.1:3001/api/v1/health/ready && exit 0; sleep 1; done; cat /tmp/lossfit-api.log; exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: frontend/test-results/
          if-no-files-found: ignore
