name: LossFit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: lossfit
          POSTGRES_PASSWORD: lossfit-ci-only
          POSTGRES_DB: lossfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://lossfit:lossfit-ci-only@127.0.0.1:5432/lossfit
      JWT_SECRET: ci-only-signing-secret-not-for-deployment-0123456789
      DELETION_LEDGER_SECRET: ci-only-ledger-secret-not-for-deployment-0123456789
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python scripts/check-vercel-config.py
      - run: python scripts/generate-api-types.py --check
      - run: python -m alembic -c backend/alembic.ini upgrade b8c4f97a61d2
      - run: python scripts/pgvector-migration-check.py seed
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python scripts/pgvector-migration-check.py verify
      - run: python -m pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  browser-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lossfit
          POSTGRES_PASSWORD: lossfit-ci-only
          POSTGRES_DB: lossfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://lossfit:lossfit-ci-only@127.0.0.1:5432/lossfit
      JWT_SECRET: ci-only-signing-secret-not-for-deployment-0123456789
      DELETION_LEDGER_SECRET: ci-only-ledger-secret-not-for-deployment-0123456789
      ENVIRONMENT: development
      CORS_ORIGINS: http://127.0.0.1:4173
      AI_BASE_URL: http://127.0.0.1:3002/v1
      AI_API_KEY: local-e2e-vision-key
      AI_MODEL: deterministic-local-test
      VISION_MODEL: deterministic-local-test
      OPEN_FOOD_FACTS_BASE_URL: http://127.0.0.1:3002
      E2E_VISION_PORT: "3002"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: nohup python scripts/e2e-vision-provider.py > /tmp/lossfit-vision.log 2>&1 &
      - run: for i in {1..30}; do curl --fail --silent http://127.0.0.1:3002/health && exit 0; sleep 1; done; cat /tmp/lossfit-vision.log; exit 1
      - run: nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 3001 --no-access-log > /tmp/lossfit-api.log 2>&1 &
      - run: for i in {1..60}; do curl --fail --silent http://127.0.0.1:3001/api/v1/health/ready && exit 0; sleep 1; done; cat /tmp/lossfit-api.log; exit 1
      - run: npm ci
        working-directory: frontend
      # GitHub-hosted Ubuntu runners include Playwright's OS libraries; install
      # only the pinned browser so CI doesn't spend time running apt upgrades.
      - run: npx playwright install chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: frontend/test-results/
          if-no-files-found: ignore
