# Include inside nginx's http block. Replace host, certificate paths and root.
# Raw request logging is disabled because callback/reset URLs can contain secrets.
server {
    listen 80;
    server_name lossfit.example.com;
    access_log off;
    error_log /dev/null;
    return 308 https://lossfit.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name lossfit.example.com;
    ssl_certificate /etc/letsencrypt/live/lossfit.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lossfit.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /dev/null;
    client_max_body_size 13m;
    root /srv/lossfit/frontend/dist;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 65s;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
